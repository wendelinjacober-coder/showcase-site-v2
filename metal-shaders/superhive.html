:root{--paper:#ffffff;--ink:#000000;--grey:#6e6e6e;--hair:#e3e3e3;--fog:#f4f4f4;--accent:#1f2bff}

.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:0 0 24px;padding:0;list-style:none}
.ctl li{position:relative;padding-left:16px;font-size:15px}

const D=JSON.parse(document.getElementById('d').textContent);

  onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.dataset.alt=''}else{this.outerHTML=this.parentNode.dataset.ph}">`}
